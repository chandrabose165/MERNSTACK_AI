<html lang="en">
  <head>
    <title>Simple_Calci</title>
    <link rel="Stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="container">
      <div class="display-container">
        <div id="history"></div>
        <div id="display"></div>
      </div>
      <button class="btn btn-gray">C</button>
      <button class="btn btn-gray">+/-</button>
      <button class="btn btn-gray">%</button>
      <button class="btn orange">/</button> <button class="btn">7</button
      ><button class="btn">8</button><button class="btn">9</button>
      <button class="btn orange">*</button>
      <button class="btn">4</button><button class="btn">5</button
      ><button class="btn">6</button>
      <button class="btn orange">-</button>
      <button class="btn">1</button><button class="btn">2</button
      ><button class="btn">3</button>
      <button class="btn orange">+</button>
      <button class="btn zero">0</button><button class="btn">.</button>
      <button class="btn orange">=</button>
      <script src="script.js"></script>
    </div>
  </body>
</html>
